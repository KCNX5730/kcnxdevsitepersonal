<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teachers Day</title>

    <style>
        /* ---------- Fullscreen reset ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a1410;
            font-family: 'Inter', sans-serif;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* ---------- Minimal loading ---------- */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1410;
            color: #f5e6d3;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        #loading.hidden {
            opacity: 0;
        }
        #loading .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(245, 230, 211, 0.10);
            border-top: 3px solid #e8b87c;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }
        #loading p {
            font-size: 0.9rem;
            letter-spacing: 0.06em;
            color: #a0806a;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- Error ---------- */
        #error-msg {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(20, 15, 12, 0.95);
            color: #f5e6d3;
            padding: 2rem;
            text-align: center;
        }
        #error-msg.visible {
            display: flex;
        }
        #error-msg h2 {
            font-size: 1.8rem;
            color: #e8b87c;
            margin-bottom: 10px;
        }
        #error-msg p {
            max-width: 420px;
            color: #c4a88a;
            line-height: 1.5;
        }
        #error-msg .retry-btn {
            margin-top: 22px;
            padding: 10px 34px;
            background: #e8b87c;
            border: none;
            border-radius: 40px;
            color: #1a1410;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.25s;
        }
        #error-msg .retry-btn:hover {
            background: #f5d0a0;
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading…</p>
    </div>

    <!-- Error -->
    <div id="error-msg">
        <h2>...</h2>
        <p>Could not load <strong>happy_teachers_day.glb</strong>.<br />Make sure it's in the same folder.</p>
        <button class="retry-btn" onclick="location.reload()">⟳ Retry</button>
    </div>

    <!-- 3D container -->
    <div id="container"></div>

    <!-- ============================================================ -->
    <!--  Three.js via importmap                                        -->
    <!-- ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // -----------------------------------------------------------------
        //  IMPORTS
        // -----------------------------------------------------------------
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // -----------------------------------------------------------------
        //  DOM REFS
        // -----------------------------------------------------------------
        const container = document.getElementById('container');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error-msg');

        // -----------------------------------------------------------------
        //  SCENE SETUP
        // -----------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1410);

        // Camera — fixed "proper" view
        const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
        const PROPER_POS = new THREE.Vector3(4.2, 3.0, 5.8);
        const PROPER_TARGET = new THREE.Vector3(0, 0.4, 0);

        camera.position.copy(PROPER_POS);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Controls — disabled (locked)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.copy(PROPER_TARGET);
        controls.enableDamping = false;
        controls.enabled = false; // locked
        controls.update();

        // -----------------------------------------------------------------
        //  LIGHTING
        // -----------------------------------------------------------------
        const ambient = new THREE.AmbientLight(0x443a32, 0.6);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffe6c8, 2.0);
        mainLight.position.set(6, 10, 4);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.normalBias = 0.02;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x8ab4d4, 0.8);
        fillLight.position.set(-4, 2, -6);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xe8b87c, 0.5);
        rimLight.position.set(-2, 4, 6);
        scene.add(rimLight);

        const hemi = new THREE.HemisphereLight(0xffeedd, 0x443a32, 0.6);
        scene.add(hemi);

        const groundGlow = new THREE.PointLight(0xe8b87c, 0.3, 8);
        groundGlow.position.set(0, -0.5, 0);
        scene.add(groundGlow);

        // -----------------------------------------------------------------
        //  GROUND / SHADOW CATCHER
        // -----------------------------------------------------------------
        const groundGeo = new THREE.PlaneGeometry(12, 12);
        const groundMat = new THREE.ShadowMaterial({
            opacity: 0.35,
            color: 0x000000,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.55;
        ground.receiveShadow = true;
        scene.add(ground);

        // Subtle disk
        const diskGeo = new THREE.RingGeometry(0.6, 1.6, 64);
        const diskMat = new THREE.MeshStandardMaterial({
            color: 0x2d1f18,
            roughness: 0.8,
            metalness: 0.1,
            transparent: true,
            opacity: 0.40,
            side: THREE.DoubleSide,
        });
        const disk = new THREE.Mesh(diskGeo, diskMat);
        disk.rotation.x = -Math.PI / 2;
        disk.position.y = -0.54;
        scene.add(disk);

        // -----------------------------------------------------------------
        //  LOAD GLB
        // -----------------------------------------------------------------
        let modelReady = false;

        const loader = new GLTFLoader();
        const draco = new DRACOLoader();
        draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
        loader.setDRACOLoader(draco);

        function loadModel() {
            loader.load(
                'happy_teachers_day.glb',
                (gltf) => {
                    const model = gltf.scene;

                    // Auto-scale & center
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    if (maxDim > 0) {
                        const scale = 2.2 / maxDim;
                        model.scale.set(scale, scale, scale);
                    }
                    const center = box.getCenter(new THREE.Vector3());
                    model.position.sub(center);
                    model.position.y += 0.1;

                    // Enable shadows + warm materials
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child
                                .material];
                                mats.forEach((m) => {
                                    if (m.color && m.color.isColor) {
                                        m.color.lerp(new THREE.Color(0xffddbb), 0.08);
                                    }
                                    m.roughness = Math.min(m.roughness || 0.5, 0.7);
                                });
                            }
                        }
                    });

                    scene.add(model);
                    modelReady = true;

                    // Hide loading
                    loadingEl.classList.add('hidden');
                    setTimeout(() => { loadingEl.style.display = 'none'; }, 800);

                    // Ensure camera stays locked at proper view
                    camera.position.copy(PROPER_POS);
                    controls.target.copy(PROPER_TARGET);
                    controls.update();
                },
                (xhr) => {
                    const pct = Math.round((xhr.loaded / xhr.total) * 100);
                    if (pct < 100) {
                        document.querySelector('#loading p').textContent = `Loading… ${pct}%`;
                    }
                },
                (err) => {
                    console.error('GLB load error:', err);
                    loadingEl.classList.add('hidden');
                    setTimeout(() => { loadingEl.style.display = 'none'; }, 400);
                    errorEl.classList.add('visible');
                }
            );
        }

        loadModel();

        // -----------------------------------------------------------------
        //  RESIZE
        // -----------------------------------------------------------------
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // -----------------------------------------------------------------
        //  ANIMATION LOOP — camera stays locked
        // -----------------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            // Enforce proper view every frame (locked)
            camera.position.copy(PROPER_POS);
            controls.target.copy(PROPER_TARGET);
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // -----------------------------------------------------------------
        //  FALLBACK: if loading takes too long
        // -----------------------------------------------------------------
        const timeoutId = setTimeout(() => {
            if (!modelReady && !errorEl.classList.contains('visible')) {
                loadingEl.classList.add('hidden');
                setTimeout(() => { loadingEl.style.display = 'none'; }, 400);
                errorEl.classList.add('visible');
            }
        }, 20000);

        document.addEventListener('model-ready', () => {
            clearTimeout(timeoutId);
        });

        console.log('🎓 Happy Teachers Day — view locked');
    </script>
</body>
</html>
